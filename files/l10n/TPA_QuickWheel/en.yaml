TIP_BIND_KEYS_TITLE: Keybinding Mode
TIP_BIND_KEYS_DESC: |-
  Hover over any wheel item and press (almost) any key to set it as keybind.
  Click on `Toggle Keybinding` button to stop.
  Press `{backspace}` to remove a keybind.
  
  Keys that open inventory or any other menu are not supported. As well as these keys:
  {forbidden}

MSG_NO_FAVORITE_MAGIC: You have no favorite spells or magic items.